name: Capture real GitHub dashboard screenshots

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/capture.mjs'
      - '.github/workflows/capture.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-screenshots
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Serve the actual website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gitroast-web.log 2>&1 &
          sleep 2
      - name: Capture site with actual GitHub REST data
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: node scripts/capture.mjs
      - name: Commit verified screenshots and data provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard-desktop.png assets/dashboard-mobile.png assets/screenshot-source.json
          git diff --cached --quiet || (git commit -m "docs: update actual dashboard screenshots from public GitHub data" && git push)
